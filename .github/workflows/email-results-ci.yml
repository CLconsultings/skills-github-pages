name: Email Results CI

on:
  pull_request:
    paths:
      - "assessment.html"
      - "privacy.html"
      - "email-results-config.js"
      - "email-worker/**"
      - ".github/workflows/email-results-ci.yml"
  push:
    branches:
      - feature/email-results
    paths:
      - "assessment.html"
      - "privacy.html"
      - "email-results-config.js"
      - "email-worker/**"
      - ".github/workflows/email-results-ci.yml"

permissions:
  contents: read

jobs:
  scoring-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm test

  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail if common live secret patterns are committed
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE --exclude='.dev.vars.example' --exclude-dir='.git' '(re_[A-Za-z0-9]{20,}|TURNSTILE_SECRET_KEY=[^r][^e][^p][^l][^a][^c][^e])' email-worker; then
            echo "Potential committed secret detected."
            exit 1
          fi
      - name: Confirm client feature is fail closed by default
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enabled: false' email-results-config.js
          grep -q 'endpoint: ""' email-results-config.js
          grep -q 'turnstileSiteKey: ""' email-results-config.js
